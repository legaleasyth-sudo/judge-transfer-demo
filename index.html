<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบโยกย้ายผู้พิพากษา (เดโม)</title>
<style>
/* Layout: login screen, then app shell = top bar + left nav (horizontal strip under 900px) + working column */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface2:#F8F9FB; --line:#E2E6EE; --fg:#1A1F2B; --muted:#5B6474; --faint:#98A1B0;
  --accent:#1F3A68; --accent-fg:#FFFFFF; --accent-soft:#E8EEF9; --gold:#B8892B; --gold-soft:#F7EFDD;
  --ok:#1E7F4F; --ok-soft:#E6F4EC; --warn:#9A6212; --warn-soft:#FDF3E1; --bad:#B42318; --bad-soft:#FCE8E6;
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#171E29; --surface2:#1C2431; --line:#2A3445; --fg:#E7EBF2; --muted:#A3AEC0; --faint:#6F7B8F;
  --accent:#8FB0EA; --accent-fg:#0F141C; --accent-soft:#1E2B44; --gold:#D9B25F; --gold-soft:#2E2512;
  --ok:#5CC48C; --ok-soft:#14301F; --warn:#E3B05A; --warn-soft:#33270F; --bad:#F08A7E; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171E29; --surface2:#1C2431; --line:#2A3445; --fg:#E7EBF2; --muted:#A3AEC0; --faint:#6F7B8F;
  --accent:#8FB0EA; --accent-fg:#0F141C; --accent-soft:#1E2B44; --gold:#D9B25F; --gold-soft:#2E2512;
  --ok:#5CC48C; --ok-soft:#14301F; --warn:#E3B05A; --warn-soft:#33270F; --bad:#F08A7E; --bad-soft:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;margin:0;text-wrap:balance}h2{font-size:15px;margin:0}h3{font-size:14px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{font:inherit;font-weight:500;border-radius:7px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.icon{padding:4px 9px;flex:none}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.acct:focus-visible,nav.side button:focus-visible,.fopt:focus-visible,.th-sort:focus-visible,.pg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.note{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.note.ok{background:var(--ok-soft);color:var(--ok)}.note.warn{background:var(--warn-soft);color:var(--warn)}.note.bad{background:var(--bad-soft);color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
select,input[type=number],input[type=text],input[type=search],input[type=password],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%}
input[readonly]{background:var(--surface2)}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.switch{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:1px 0 0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:19px}
.switch input:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ----- Login ----- */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login-card{display:grid;grid-template-columns:400px minmax(0,1fr);max-width:1080px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.login-side{background:var(--accent);color:var(--accent-fg);padding:32px;display:flex;flex-direction:column;gap:18px}
.login-side h1{font-size:26px}
.login-side p{margin:0;opacity:.85}
.login-side .flow{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.login-side .flow div{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.login-side .flow b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:color-mix(in srgb,var(--accent-fg) 18%,transparent)}
.login-side .phase{margin-top:auto;border-radius:10px;padding:12px;background:color-mix(in srgb,var(--accent-fg) 12%,transparent);font-size:13px}
.login-main{padding:32px;display:flex;flex-direction:column;gap:16px}
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.acct{font:inherit;color:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.acct[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--gold-soft);color:var(--gold)}
.av.sm{width:30px;height:30px;font-size:12px}
@media (max-width:900px){.login-card{grid-template-columns:1fr}.login-side .flow{display:none}}
@media (max-width:520px){.login-side,.login-main{padding:20px}}

/* ----- Shell: full-height left sidebar (off-canvas drawer under 900px) + slim top bar + working area ----- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px 10px}
.sb-brand{display:flex;gap:10px;align-items:center;padding:2px 6px 12px;line-height:1.25}
.sb-brand b{font-size:14px;display:block}.sb-brand span{font-size:11.5px;color:var(--muted)}
.logo{flex:none;width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.sb-org{font-size:11.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin:0 2px 8px;line-height:1.35}
nav.side{display:flex;flex-direction:column;gap:1px}
nav.side .grp{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.05em;padding:10px 10px 3px}
nav.side button{font:inherit;font-size:13px;text-align:left;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:500;display:flex;gap:9px;align-items:center}
nav.side button:hover{background:var(--surface2);color:var(--fg)}
nav.side button svg{flex:none;opacity:.85}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side button .cnt{margin-left:auto;font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 7px}
.phasebox{margin:14px 2px 0;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;background:var(--surface)}
.sb-user{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;line-height:1.25;font-size:12.5px}
.sb-user small{display:block;color:var(--muted);font-size:11px}
.scrim{display:none}
.mainc{min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:50px;padding-block:6px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.proto{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 8px;white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.bell{position:relative}
.bell em{position:absolute;top:-4px;right:-4px;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;display:grid;place-items:center;padding:0 4px}
.burger,.top-av{display:none}
main#main{padding-block:16px 40px;width:100%;max-width:1600px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;left:0;top:0;bottom:0;height:auto;width:280px;max-width:86vw;z-index:30;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 10px 40px rgb(0 0 0/.18);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .app.open .sb{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgb(10 14 20/.4);z-index:25}
  .burger,.top-av{display:inline-flex}
  .crumb .sys,.top-phase{display:none}
}
@media (max-width:520px){.proto{display:none}}
.pagehead{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.pagehead .grow{min-width:240px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr) 320px}}
@media (max-width:980px){.grid2,.grid2e,.grid3{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* phase stepper */
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ph{border-top:3px solid var(--line);padding-top:8px;font-size:12.5px}
.ph b{display:block;font-size:13px}
.ph.done{border-color:var(--ok)}.ph.now{border-color:var(--accent)}
.ph.now b{color:var(--accent)}
@media (max-width:700px){.phases{grid-template-columns:1fr}.ph{border-top:0;border-left:3px solid var(--line);padding:2px 0 2px 10px}}

/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.steps button i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:12px;font-weight:600}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.steps button[aria-current="step"] i{background:var(--accent);color:var(--accent-fg)}
.steps button.done i{background:var(--ok-soft);color:var(--ok)}
.choice{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.choice.empty{border-style:dashed;background:transparent;color:var(--faint)}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent);color:var(--accent-fg)}
.choice.empty .num{background:var(--surface2);color:var(--faint)}
.rec{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.rec.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rec.blocked{opacity:.72}
.reasons{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.r-ok{color:var(--ok)}.r-bad{color:var(--bad)}.r-mid{color:var(--muted)}.r-warn{color:var(--warn)}
.doc{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface2)}

/* tables & lists */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);background:var(--surface2);padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
table.click tbody tr{cursor:pointer}table.click tbody tr:hover{background:var(--surface2)}
tbody tr.sel{background:var(--accent-soft)}
td.n{font-variant-numeric:tabular-nums;color:var(--muted)}
.me-tag{font-size:11px;color:var(--gold);font-weight:600;margin-left:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.step{border-radius:8px;background:var(--surface2);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.step .pill{white-space:normal}
.empty-state{color:var(--muted);text-align:center;padding:32px 12px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dot.w{background:var(--warn)}.dot.b{background:var(--bad)}.dot.o{background:var(--ok)}
.log .li{align-items:flex-start}
.log time{flex:none;width:140px;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
@media (max-width:600px){.log .li{flex-wrap:wrap}.log time{width:100%}}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar .track{height:14px;border-radius:4px;background:var(--surface2);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.hbar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.court{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:13px}
.court summary{cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
.court summary::-webkit-details-marker{display:none}
.seats{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.seat{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:5px 8px;border-radius:6px;background:var(--surface2)}
.seat.vac{border:1px dashed var(--line);background:transparent;color:var(--faint)}
.region-h{display:flex;gap:10px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.region-h::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--gold)}
.tree{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.code{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px;flex:none}
.case{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.picks{position:sticky;top:62px}
@media (max-width:980px){.picks{position:static;order:-1}}
.top-right .btn{white-space:nowrap}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.stat:hover{border-color:var(--accent)}
button.stat span::after{content:" ›";color:var(--faint)}
.seat[data-act],.case[data-act]{cursor:pointer}.seat[data-act]:hover{background:var(--accent-soft)}.case[data-act]:hover{border-color:var(--accent)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.x{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft);text-decoration:line-through}
.fgroup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.fgroup>span{font-size:12px;color:var(--muted);min-width:64px}
.search{max-width:280px}
/* nationwide org chart */
.ochart{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0 4px}
.onode{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center;cursor:pointer;min-width:190px;display:flex;flex-direction:column;gap:2px;align-items:center}
.onode:hover,.oitem:hover{border-color:var(--accent)}
.onode[aria-pressed="true"],.oitem[aria-pressed="true"],.crow[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.onode.root{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);min-width:220px}
.onode.root .muted{color:inherit;opacity:.8}
.onode.side{border-style:dashed;background:var(--surface2)}
.toprow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;width:100%;max-width:860px}
.toprow .l{display:flex;align-items:center}.toprow .l .onode{flex:none}
.toprow .l::after{content:"";flex:1;border-top:2px dashed var(--line);min-width:16px}
.toprow .r{display:flex;align-items:center;flex-direction:row-reverse}.toprow .r .onode{flex:none}
.toprow .r::after{content:"";flex:1;border-top:2px dashed var(--line);min-width:16px}
.vline{width:2px;height:22px;background:var(--line)}
.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;position:relative;padding-top:22px}
.branches::before{content:"";position:absolute;top:0;left:16.66%;right:16.66%;height:2px;background:var(--line)}
.branch{display:flex;flex-direction:column;align-items:center;position:relative}

function runMatch(){

function notes(){
  const u=S.user,out=[];if(!u)return out;
  if(u.role==="judge"){const j=CUR();
    if(S.phase===0&&j.req.status!=="submitted")out.push({tone:mustMove(j)?"b":"w",text:`ยังไม่ได้ส่งคำขอ ปิดรับ 15 ม.ค. 2570${mustMove(j)?" · คุณครบวาระต้องย้าย":""}`,go:"wish"});
    if(S.reminded[j.id]&&j.req.status!=="submitted")out.push({tone:"b",text:"เจ้าหน้าที่ภาคส่งแจ้งเตือนให้ยื่นคำขอ",go:"wish"});
    for(const d of j.req.docs||[])if(d.status==="more")out.push({tone:"b",text:`เจ้าหน้าที่ขอเอกสารเพิ่ม: ${d.note||d.name}`,go:"wish"});
    if(S.phase===4){const r=S.result.res[j.id];out.push({tone:"o",text:r.to&&r.to!==j.court?`ประกาศผลแล้ว: ย้ายไป ${C[r.to].name}`:"ประกาศผลแล้ว: อยู่ที่เดิม",go:"result"})}
    if(S.phase>0&&S.phase<4)out.push({tone:"",text:`รอบนี้อยู่ขั้น "${PH[S.phase]}"`,go:"result"});
  }
  if(u.role==="region"){const rj=JUDGES.filter(j=>inRegion(j,5));
    const pd=rj.filter(pendingDocs).length;if(pd)out.push({tone:"w",text:`เอกสารรอตรวจ ${pd} ราย`,go:"review"});
    const miss=rj.filter(j=>mustMove(j)&&j.req.status!=="submitted"&&!S.reminded[j.id]).length;if(miss&&S.phase===0)out.push({tone:"b",text:`ครบวาระแต่ยังไม่ส่งคำขอ ${miss} ราย ยังไม่ได้แจ้งเตือน`,go:"rhome"});
  }
  if(u.role==="central"){
    if(S.phase===0)out.push({tone:"",text:"ถึงกำหนดปิดรับคำขอแล้ว กดปิดรับเมื่อพร้อม",go:"chome"});
    if(S.phase===1)out.push({tone:"",text:"ข้อมูลพร้อมแล้ว เริ่มจัดวางได้",go:"chome"});
    if(S.phase===2){const n=JUDGES.filter(j=>["auto","none"].includes(S.result.res[j.id].kind)).length;if(n)out.push({tone:"w",text:`มี ${n} รายที่ระบบเสนออัตโนมัติ รอยืนยัน`,go:"run"});
      coupleIssues().filter(c=>!c.ok).forEach(c=>out.push({tone:"w",text:`ยื่นแบบคู่ ${J[c.a].name} ${c.same?"ได้ศาลเดียวกัน":"ห่างกัน "+c.d+" กม."}`,go:"run"}))}
    if(S.ktNote&&S.phase===2)out.push({tone:"b",text:`ก.ต. ส่งกลับ: ${S.ktNote}`,go:"chome"});
  }
  if(u.role==="kt"&&S.phase===3)out.push({tone:"w",text:"มีร่างบัญชีรอพิจารณา",go:"khome"});
  return out;
}

function recFor(me){
  return COURTS.filter(c=>c.id!==me.court).map(c=>{
    const ch=check(me,c.id),blk=ch.some(x=>x.sev==="block");const reasons=[];let fit=0,total=0;
    if(me.cond.near&&me.spouse){total++;const d=km(me.spouse.prov,c.prov);const sepOk=me.cond.sep==="prov"?c.prov!==me.spouse.prov:true;
      if(d<=me.cond.km&&sepOk){fit++;reasons.push(["ok",`ห่างที่ทำงานคู่สมรส ${d} กม.`])}else reasons.push(["mid",`ห่างคู่สมรส ${d} กม.${d>me.cond.km?" (เกินที่ตั้งไว้)":sepOk?"":" (จังหวัดเดียวกัน)"}`]);
      if(me.spouse.prov!==c.prov&&sepOk)reasons.push(["ok","คนละเขตอำนาจกับคู่สมรส"])}
    if(me.mother&&me.cond.careNear!==false){total++;const d=km(me.mother,c.prov);if(d<=150){fit++;reasons.push(["ok",`ห่างผู้ที่ต้องดูแล ${d} กม.`])}else reasons.push(["mid",`ห่างผู้ที่ต้องดูแล ${d} กม.`])}
    if(me.kids&&me.kids===c.prov)reasons.push(["ok","จังหวัดเดียวกับโรงเรียนบุตร"]);
    ch.forEach(x=>reasons.push([x.sev==="block"?"bad":"warn",`${x.code} ${x.msg}`]));
    const seniorWant=JUDGES.filter(j=>j.sen<me.sen&&sub(j).includes(c.id)).length;
    return {c,blk,fit,total,reasons,seniorWant,dist:me.spouse?km(me.spouse.prov,c.prov):km(C[me.court].prov,c.prov)}
  }).sort((a,b)=>(a.blk-b.blk)||(b.fit-a.fit)||(a.dist-b.dist));
}

    if(r.to&&r.to!==j.court){const w=check(j,r.to).filter(x=>x.sev==="warn");if(w.length)cases.push({tone:"warn",tag:"มีคำเตือน",j,body:w.map(x=>`${x.code} ${x.msg}`).join(" · ")+` · ${C[r.to].name}`})}

      <p class="small muted" style="margin:0">ระบบตรวจทุกคู่แล้ว ไม่มีกรณีที่ผู้อาวุโสกว่าอยากได้ศาลหนึ่งและผ่านกฎ แต่ศาลนั้นไปตกกับผู้อาวุโสน้อยกว่า</p></section>

      ${done?`<div class="note ok">อนุมัติเมื่อ ${esc(S.ktDecision)} ประกาศผลให้ผู้พิพากษาแล้ว</div><button class="btn" data-act="switch" data-arg="judge" style="align-self:flex-start">ดูผลในมุมผู้พิพากษา</button>`:

/* list views opened from the number cards; scope = all courts or one region */
function listView(courts,mode){
  const T={courts:"ศาลทั้งหมด",seats:"อัตรากำลังรายศาล",vac:"ศาลที่มีตำแหน่งว่าง",forced:"ผู้ครบวาระ ต้องย้ายรอบนี้",apply:"ศาลที่มีคำขอย้ายเข้ามากที่สุด",provs:"จังหวัดทั้งหมด"};
  const back=`<div class="row" style="margin-bottom:10px"><button class="btn small" data-act="nlist" data-arg="">‹ กลับไปที่ผัง</button><h2 class="grow">${T[mode]}</h2></div>`;
  if(mode==="provs"){const rows=[];for(let rg=1;rg<=9;rg++)for(const p of NREG[rg]){const g=NATION.regions[rg].groups.find(g=>g.prov===p);const s=sumStats(g.courts);rows.push({p,rg,s})}
    return back+`<div class="tablewrap"><table class="click"><thead><tr><th>จังหวัด</th><th>ภาค</th><th>ศาล</th><th>อัตรา</th><th>ว่าง</th><th>ครบวาระ</th></tr></thead><tbody>
      ${rows.map(r=>`<tr data-act="nreg" data-arg="${r.rg}"><td><b>จ.${esc(r.p)}</b></td><td>ภาค ${r.rg}</td><td class="n">${r.s.courts}</td><td class="n">${r.s.seats}</td><td class="n">${r.s.seats-r.s.filled}</td><td class="n">${r.s.forced}</td></tr>`).join("")}</tbody></table></div>`}
  if(mode==="forced"){const rows=[];for(const c0 of courts){const P=people(c0);P.holders.forEach((p,i)=>{if(p.forced)rows.push({p,i,c:c0})})}rows.sort((a,b)=>a.p.sen-b.p.sen);
    return back+`<p class="small muted" style="margin:0 0 8px">${rows.length} คน · คลิกเพื่อดูประวัติ</p><div class="tablewrap"><table class="click"><thead><tr><th>อาวุโส</th><th>ชื่อ</th><th>ศาลปัจจุบัน</th><th>อยู่มาแล้ว</th><th>คำขอ</th></tr></thead><tbody>
      ${rows.map(r=>`<tr data-act="nperson" data-arg="${r.c.id}|h|${r.i}"><td class="n">#${fmt(r.p.sen)}</td><td><b>${esc(r.p.name)}</b>${r.c.demo?' <span class="pill gold">เดโม</span>':""}</td><td>${esc(r.c.name)}</td><td class="n" style="white-space:nowrap">${r.p.months} เดือน</td><td>${pill(...REQTXT[r.p.req||"none"])}</td></tr>`).join("")}</tbody></table></div>`}
  let cs=courts.map(cstat);
  if(mode==="vac")cs=cs.filter(c=>c.seats>c.filled).sort((a,b)=>(b.seats-b.filled)-(a.seats-a.filled));
  if(mode==="apply")cs=cs.sort((a,b)=>b.apply-a.apply);
  if(mode==="seats")cs=cs.sort((a,b)=>b.seats-a.seats);
  return back+`<p class="small muted" style="margin:0 0 8px">${cs.length} ศาล · คลิกเพื่อดูรายละเอียด</p><div class="tablewrap"><table class="click"><thead><tr><th>ศาล</th><th>ที่ตั้ง</th><th>อัตรา</th><th>มีคน</th><th>ว่าง</th><th>ครบวาระ</th><th>คำขอเข้า</th></tr></thead><tbody>
    ${cs.map(c=>`<tr data-act="nsel" data-arg="${c.id}" class="${S.nsel===c.id?"sel":""}"><td><b>${esc(c.name)}</b>${c.demo?' <span class="pill gold">เดโม</span>':""}</td><td class="small muted">${c.prov?"จ."+esc(c.prov):c.rg===0?"กรุงเทพฯ":c.rg?"ภาค "+c.rg:"ส่วนกลาง"}</td>

function rlState(k){return S.rl[k]||(S.rl[k]={pg:1,size:15,sort:null,dir:1,sel:null,tab:"f",q:"",f:{}})}
function pageNums(p,n){const s=new Set([1,n,p-1,p,p+1]);const a=[...s].filter(x=>x>=1&&x<=n).sort((x,y)=>x-y);const out=[];a.forEach((x,i)=>{if(i&&x-a[i-1]>1)out.push("…");out.push(x)});return out}
function recordList(o){
  const k=o.key,st=rlState(k),q=st.q.trim();

  const total=rows.length,pages=Math.max(1,Math.ceil(total/st.size));if(st.pg>pages)st.pg=pages;
  const from=(st.pg-1)*st.size,view=rows.slice(from,from+st.size);
  const sel=st.sel!=null?o.rows.find(r=>o.id(r)===st.sel):null;if(st.sel!=null&&!sel){st.sel=null}
  const active=o.filters.filter(fl=>st.f[fl.k]!=null&&st.f[fl.k]!=="all");
  const optLabel=(fl,v)=>(fl.opts.find(x=>x[0]===v)||[,v])[1];
  const head=`<div class="rl-head"><div class="grow"><h1>${esc(o.title)}</h1><p class="sub">${o.sub}</p></div>
    <label class="rl-search">${ICO.search}<input type="search" id="q-${k}" data-rlq="${k}" placeholder="${esc(o.ph)}" value="${esc(st.q)}" aria-label="${esc(o.ph)}" autocomplete="off"></label>
    ${o.add?`<button class="btn primary" data-act="madd" data-arg="${o.add.kind}" ${o.add.off?`disabled title="${esc(o.add.off)}"`:""}>＋ ${esc(o.add.label)}</button>`:""}</div>
    ${o.add&&o.add.off||o.note?`<p class="small muted" style="margin:-4px 0 8px">${esc(o.note||o.add.off)}</p>`:""}`;
  const chips=active.length||q?`<div class="rl-active"><span>ตัวกรอง:</span>${active.map(fl=>`<button data-act="rlf" data-arg="${k}|${fl.k}|all" title="เอาตัวกรองนี้ออก">${esc(fl.label)}: ${esc(optLabel(fl,st.f[fl.k]))} ✕</button>`).join("")}${q?`<button data-act="rlqclear" data-arg="${k}" title="ล้างคำค้น">“${esc(q)}” ✕</button>`:""}<button class="clear" data-act="rlfclear" data-arg="${k}">ล้างทั้งหมด</button></div>`:"";
  const th=o.cols.map((c,i)=>`<th${c.cls?` class="${c.cls}"`:""}>${c.sort?`<button class="th-sort" data-act="rlsort" data-arg="${k}|${i}">${esc(c.h)}${st.sort===i?`<i>${st.dir>0?"▲":"▼"}</i>`:""}</button>`:esc(c.h)}</th>`).join("")+(o.actions?'<th class="act"></th>':"");
  const body=view.map(r=>{const id=o.id(r);return`<tr data-act="rlsel" data-arg="${k}|${id}" class="${st.sel===id?"sel":""}">${o.cols.map(c=>`<td${c.cls?` class="${c.cls}"`:""}>${c.cell(r)}</td>`).join("")}${o.actions?`<td class="act">${o.actions(r)}</td>`:""}</tr>`}).join("")
    ||`<tr><td colspan="${o.cols.length+(o.actions?1:0)}" class="empty-state">ไม่พบรายการที่ตรงกับตัวกรองหรือคำค้น</td></tr>`;
  const foot=`<div class="rl-foot"><span>แสดง ${total?fmt(from+1):0}–${fmt(Math.min(total,from+st.size))} จาก ${fmt(total)} รายการ${total!==o.rows.length?` (ทั้งหมด ${fmt(o.rows.length)})`:""}</span><span class="grow"></span>
    <label class="row" style="gap:6px">แถวต่อหน้า <select data-rlsize="${k}" aria-label="แถวต่อหน้า">${[10,15,25,50].map(n=>`<option ${n===st.size?"selected":""}>${n}</option>`).join("")}</select></label>
    <div class="pg" role="navigation" aria-label="แบ่งหน้า"><button data-act="rlpg" data-arg="${k}|${st.pg-1}" ${st.pg<=1?"disabled":""} aria-label="หน้าก่อน">‹</button>${pageNums(st.pg,pages).map(n=>n==="…"?"<span>…</span>":`<button data-act="rlpg" data-arg="${k}|${n}" ${n===st.pg?'aria-current="page"':""}>${n}</button>`).join("")}<button data-act="rlpg" data-arg="${k}|${st.pg+1}" ${st.pg>=pages?"disabled":""} aria-label="หน้าถัดไป">›</button></div></div>`;
  const filt=o.filters.map(fl=>`<div class="fsec"><h3>${esc(fl.label)}</h3><div class="fopts">${[["all","ทั้งหมด"],...fl.opts].map(([v,l])=>`<button class="fopt" data-act="rlf" data-arg="${k}|${fl.k}|${v}" aria-pressed="${(st.f[fl.k]||"all")===v}">${esc(l)}<span class="c">${fmt(v==="all"?o.rows.length:o.rows.filter(r=>fl.test(r,v)).length)}</span></button>`).join("")}</div></div>`).join("")
    +(active.length?`<button class="btn small" data-act="rlfclear" data-arg="${k}">ล้างตัวกรอง</button>`:"");
  const panel=`<div class="rl-panel${st.tab==="f"&&!st.fopen?" collapsed":""}" id="panel-${k}"><div class="rl-tabs" role="tablist"><button role="tab" aria-selected="${st.tab==="f"}" data-act="rltab" data-arg="${k}|f">ตัวกรอง${active.length?` (${active.length})`:""}</button><button role="tab" aria-selected="${st.tab==="d"}" data-act="rltab" data-arg="${k}|d">รายละเอียด</button></div>
    <div class="rl-pbody">${st.tab==="f"?filt:sel?o.detail(sel):`<p class="muted small" style="margin:0">คลิกแถวในตารางเพื่อดูรายละเอียดที่นี่</p>`}</div></div>`;
  return`${head}${chips}<div class="rl"><div class="rl-box"><div class="tablewrap"><table class="rt click" style="min-width:${o.minw||760}px"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>${foot}</div>${panel}</div>`;
}
const rowBtns=(kind,id,p)=>`${p.open?`<button class="btn icon ghost" data-act="open" data-arg="${p.open}" title="เปิดฉบับเต็ม" aria-label="เปิดฉบับเต็ม">${ICO.open}</button>`:""}${p.edit?`<button class="btn icon ghost" data-act="medit" data-arg="${kind}|${id}" title="แก้ไข" aria-label="แก้ไข">${ICO.edit}</button>`:""}${p.del?`<button class="btn icon ghost danger" data-act="mdel" data-arg="${kind}|${id}" title="ลบ" aria-label="ลบ">${ICO.trash}</button>`:""}`;
const TMON={"ม.ค.":1,"ก.พ.":2,"มี.ค.":3,"เม.ย.":4,"พ.ค.":5,"มิ.ย.":6,"ก.ค.":7,"ส.ค.":8,"ก.ย.":9,"ต.ค.":10,"พ.ย.":11,"ธ.ค.":12};
const dayIx=d=>{if(!d)return 9e9;const[x,m,y]=d.split(" ");return(+y)*400+(TMON[m]||0)*32+(+x)};
const shortD=d=>d?d.replace(/ 25(\d\d)$/," $1"):"–";
const posShort=cid=>({p:"ศาลจังหวัด",m:"ศาลแขวง",j:"เยาวชนฯ"})[cid.split("-")[1]];
const REGOPTS=()=>[...new Set(COURTS.map(c=>c.region))].sort().map(r=>[String(r),"ภาค "+r]);

/* ---------- permissions ---------- */
const canReqEdit=()=>S.user.role==="central"&&S.phase===0;
const reqOff=()=>S.user.role!=="central"?null:S.phase>0?"ปิดรับคำขอแล้ว บันทึกหรือแก้คำขอไม่ได้ในขั้นนี้":null;
const regOff=()=>S.phase>=3?"ทะเบียนถูกล็อกระหว่างเสนอ ก.ต. และหลังประกาศผล":null;
const canJudgeAdd=()=>S.user.role==="central"&&!regOff();
const canJudgeEdit=j=>!regOff()&&(S.user.role==="central"||(S.user.role==="region"&&inRegion(j,5)));
const PROTECTED=()=>new Set([...ACCOUNTS.filter(a=>a.judge).map(a=>a.judge),...COUPLES.flat()]);

/* ---------- คำขอทั้งหมด ---------- */
function reqDetail(j){
  const can=canReqEdit();const text=j.req.special||j.req.reason;
  return`<div class="dp-h"><span class="av sm">${esc(j.name.replace(/^(นางสาว|นาย|นาง)/,"").slice(0,2))}</span><div class="grow"><b>${esc(j.name)}</b><div class="small muted">#${fmt(j.sen)} · ${esc(C[j.court].name)} · ภาค ${C[j.court].region}</div></div><button class="btn icon ghost" data-act="rlclose" data-arg="reqs" aria-label="ปิด">${ICO.x}</button></div>
    <div class="row" style="gap:6px">${reqPill(j)}${mustMove(j)?pill("warn","ครบวาระ"):""}${j.req.couple?pill("gold","ยื่นแบบคู่"):""}</div>
    <div class="stack" style="gap:6px">${j.prefs.length?j.prefs.map((c,i)=>{const ch=check(j,c);return`<div class="step"><b>${i+1}. ${esc(C[c].name)}</b>${ch.length?ch.map(x=>`<span class="${x.sev==="block"?"r-bad":"r-warn"}">${x.sev==="block"?"✕":"!"} ${x.code} ${esc(x.msg)}</span>`).join(""):'<span class="r-ok">✓ ผ่านกฎ</span>'}</div>`}).join(""):`<p class="small muted" style="margin:0">ยังไม่ได้เลือกศาล</p>`}</div>
    ${text?`<div class="note">${esc(text)}</div>`:""}
    <dl class="kv"><dt>ยื่นเมื่อ</dt><dd>${esc(j.req.at||"–")}</dd><dt>เอกสาร</dt><dd>${(j.req.docs||[]).length?`${j.req.docs.length} ไฟล์ · รอตรวจ ${pendingDocs(j)}`:"ไม่มี"}</dd>${j.req.channel?`<dt>ช่องทาง</dt><dd>${esc(j.req.channel)}</dd>`:""}</dl>
    <button class="btn primary" data-act="open" data-arg="${j.id}">เปิดคำขอฉบับเต็ม</button>
    ${can?`<div class="dp-acts"><button class="btn small" data-act="medit" data-arg="req|${j.id}">${ICO.edit} ${j.req.status==="submitted"?"แก้ไขคำขอ":"บันทึกคำขอ"}</button>${j.req.status!=="none"?`<button class="btn small danger" data-act="mdel" data-arg="req|${j.id}">${ICO.trash} ยกเลิกคำขอ</button>`:""}</div>`:""}`;
}

  return recordList({key:"reqs",title:"คำขอทั้งหมด",ph:"ค้นหาชื่อหรือเลขอาวุโส",minw:800,
    sub:`รอบมีผล 1 เม.ย. 2570 · ${JUDGES.length} คนใน ${COURTS.length} ศาล · คลิกแถวเพื่อดูรายละเอียด`,

    filters:[
      {k:"status",label:"สถานะคำขอ",opts:[["submitted","ส่งแล้ว"],["draft","มีร่าง"],["none","ยังไม่ยื่น"]],test:(j,v)=>j.req.status===v},
      {k:"region",label:"ภาค",opts:REGOPTS(),test:(j,v)=>C[j.court].region===+v},
      {k:"flag",label:"เฉพาะกรณี",opts:[["forced","ครบวาระ"],["docs","เอกสารรอตรวจ"],["special","มีเหตุผลพิเศษหรือเอกสาร"],["blocked","มีตัวเลือกติดกฎ"],["couple","ยื่นแบบคู่"]],
        test:(j,v)=>(v==="forced"&&mustMove(j))||(v==="docs"&&!!pendingDocs(j))||(v==="special"&&!!(j.req.special||(j.req.docs||[]).length))||(v==="blocked"&&j.prefs.some(c=>blocked(j,c)))||(v==="couple"&&!!j.req.couple)},
    ],
    cols:[
      {h:"อาวุโส",cls:"n",cell:j=>`#${fmt(j.sen)}`,sort:j=>j.sen},
      {h:"ชื่อ",cell:j=>`<b>${esc(j.name)}</b>${mustMove(j)?' <span class="pill warn">ครบวาระ</span>':""}${j.req.couple?' <span class="pill gold">คู่</span>':""}`,sort:j=>j.name},
      {h:"ศาลปัจจุบัน",cell:j=>esc(shortC(j.court)),sort:j=>C[j.court].region*1000+COURTS.indexOf(C[j.court])},
      {h:"ความประสงค์",cell:j=>j.prefs.length?`<div class="chips" title="${esc(j.prefs.map((c,i)=>`${i+1}. ${C[c].name}${blocked(j,c)?" (ติดกฎ)":""}`).join("\n"))}"><span class="chip ${blocked(j,j.prefs[0])?"x":""}">1. ${esc(shortC(j.prefs[0]))}</span>${j.prefs.length>1?`<span class="chip">+${j.prefs.length-1}</span>`:""}${j.prefs.slice(1).some(c=>blocked(j,c))?'<span class="chip x" style="text-decoration:none">ติดกฎ</span>':""}</div>`:'<span class="faint">–</span>',sort:j=>j.prefs[0]?C[j.prefs[0]].name:"ฮ"},
      {h:"สถานะ",cell:reqPill,sort:j=>["submitted","draft","none"].indexOf(j.req.status)},
      {h:"เอกสาร",cell:j=>(j.req.docs||[]).length?docPill(j.req.docs.find(d=>d.status!=="ok")||j.req.docs[0]):'<span class="faint">–</span>',sort:j=>-pendingDocs(j)},
      {h:"ยื่นเมื่อ",cls:"small muted",cell:j=>esc(shortD(j.req.at)),sort:j=>dayIx(j.req.at)},

    actions:j=>rowBtns("req",j.id,{open:can?null:j.id,edit:can,del:can&&j.req.status!=="none"}),
    detail:reqDetail});
}

      {h:"วาระ",cell:j=>mustMove(j)?pill("warn","ครบวาระ"):j.months>=cap-12?pill("info","ใกล้ครบ"):pill("neutral","ยังไม่ครบ"),sort:j=>-j.months},

    ],

function pageCourts(){

}
function askDelete(kind,id){
  if(kind==="req"){const j=J[id];S.confirm={kind,id,title:"ยกเลิกคำขอนี้?",ok:"ยกเลิกคำขอ",body:`<p style="margin:0">คำขอของ <b>${esc(j.name)}</b> จะกลับเป็น “ยังไม่ยื่น” และความประสงค์ ${j.prefs.length} อันดับจะถูกล้าง</p>${mustMove(j)?`<div class="note warn">รายนี้ครบวาระ ถ้าไม่มีคำขอ ระบบจะหาที่ลงให้จากที่นั่งที่เหลือ</div>`:""}<p class="small muted" style="margin:0">การยกเลิกถูกบันทึกในประวัติคำขอและบันทึกการดำเนินการ</p>`}}
  else if(kind==="judge"){const j=J[id];
    if(PROTECTED().has(id))S.confirm={title:"ลบรายนี้ไม่ได้",body:`<p style="margin:0"><b>${esc(j.name)}</b> ใช้เป็นบัญชีเดโมหรือยื่นแบบคู่อยู่ จึงลบออกจากทะเบียนในเดโมไม่ได้ ลองลบคนอื่น หรือเพิ่มคนใหม่แล้วลบ</p>`};
    else S.confirm={kind,id,title:"ลบออกจากทะเบียน?",ok:"ลบ",body:`<p style="margin:0">ลบ <b>${esc(j.name)}</b> (#${fmt(j.sen)}) ออกจากทะเบียน เช่น เกษียณ ลาออก หรือย้ายไปศาลสูง</p><p style="margin:0">ที่นั่งที่ ${esc(C[j.court].name)} จะว่าง 1 ที่${S.phase===2?" และร่างผลจะคำนวณใหม่":""}</p>`}}
  else{const c=C[id],h=JUDGES.filter(j=>j.court===id).length,ap=JUDGES.filter(j=>j.prefs.includes(id)).length;
    if(h)S.confirm={title:"ลบศาลนี้ไม่ได้",body:`<p style="margin:0"><b>${esc(c.name)}</b> ยังมีผู้พิพากษา ${h} คน ย้ายหรือลบผู้พิพากษาออกก่อน แล้วจึงลบศาล</p>`};
    else S.confirm={kind,id,title:"ลบศาลนี้?",ok:"ลบศาล",body:`<p style="margin:0">ลบ <b>${esc(c.name)}</b> ออกจากทะเบียน</p>${ap?`<div class="note warn">มี ${ap} คนเลือกศาลนี้ไว้ในคำขอ อันดับนั้นจะถูกเอาออก</div>`:""}`}}
  render();
}
function doDelete(){
  const{kind,id}=S.confirm;S.confirm=null;
  if(kind==="req"){const j=J[id];j.prefs=[];j.req.status="none";j.req.at=null;hist(j,"เจ้าหน้าที่ยกเลิกคำขอ");log(`ยกเลิกคำขอของ ${j.name}`);render();toast("ยกเลิกคำขอแล้ว");return}
  if(kind==="judge"){const j=J[id];JUDGES.splice(JUDGES.indexOf(j),1);delete J[id];delete S.locks[id];if(S.detail===id)S.detail=null;rlState("judges").sel=null;rlState("reqs").sel===id&&(rlState("reqs").sel=null);
    log(`ลบ ${j.name} (#${fmt(j.sen)}) ออกจากทะเบียน`);afterDataChange();render();toast("ลบออกจากทะเบียนแล้ว");return}
  const c=C[id];let n=0;for(const j of JUDGES){if(j.prefs.includes(id)){j.prefs=j.prefs.filter(x=>x!==id);hist(j,`อันดับที่เลือก ${c.name} ถูกเอาออกเพราะศาลถูกลบ`);n++}if(S.locks[j.id]===id)delete S.locks[j.id]}
  COURTS.splice(COURTS.indexOf(c),1);delete C[id];rlState("courts").sel=null;if(S.openCourt===id)S.openCourt=null;
  log(`ลบ${c.name}ออกจากทะเบียนศาล${n?` (เอาออกจากคำขอ ${n} ราย)`:""}`);afterDataChange();render();toast("ลบศาลแล้ว");
}

const PAGES={nation:pageNation,reqs:pageReqs,req:pageReq,home:pageJudgeHome,wish:pageWish,result:pageResult,history:pageHistory,rhome:pageRegionHome,review:pageReview,org:pageOrg,chome:pageCentralHome,run:pageRun,rules:pageRules,log:pageLog,khome:pageKT,judges:pageJudges,courts:pageCourts};

/* =========================================================
   Actions
   ========================================================= */
function login(id){const a=ACCOUNTS.find(x=>x.id===id);S.user=a;S.page=NAV[a.role][0][0];S.sel=null;S.step=0;S.nreg=null;S.nsel="root";S.nlist=null;S.nperson=null;S.ntab="h";S.rl={};S.drawer=false;render();window.scrollTo({top:0});toast(`เข้าสู่ระบบเป็น ${a.roleName}`)}
function saveReason(){const t=document.getElementById("reason");if(t){const j=CUR();j.req.reason=t.value}}
const ACT={
  pick:a=>{S.pick=a;renderLogin()},
  nsel:a=>{S.nsel=a;S.nperson=null;S.ntab="h";render();if(innerWidth<=980){const p=document.querySelector(".sticky");if(p)p.scrollIntoView({behavior:"smooth",block:"start"})}},
  nreg:a=>{S.nreg=a===""?null:+a;S.nsel=null;S.nlist=null;S.nperson=null;render();window.scrollTo({top:0})},
  nlist:a=>{S.nlist=a||null;S.nperson=null;render();window.scrollTo({top:0})},
  nlist2:a=>{S.nreg=null;S.nlist=a;S.nperson=null;render();window.scrollTo({top:0})},
  ntab:a=>{S.ntab=a;render()},
  nperson:a=>{if(!a){S.nperson=null}else{const[court,kind,i]=a.split("|");S.nperson={court,kind,i:+i};S.nsel=court}render();if(innerWidth<=980){const p=document.querySelector(".sticky");if(p)p.scrollIntoView({behavior:"smooth",block:"start"})}},
  open:a=>{saveReason();if(S.page!=="req")S.back=S.page;S.detail=a;go("req")},
  back:()=>go(S.back||NAV[S.user.role][0][0]),
  reqs:a=>{const st=rlState("reqs");st.f={};st.q="";st.pg=1;st.sel=null;st.tab="f";if(a){const[k,v]=a.split(":");st.f[k]=v}go("reqs")},
  rlsel:a=>{const[k,id]=a.split("|");const st=rlState(k);st.sel=id;st.tab="d";render();if(innerWidth<=980){const p=document.getElementById("panel-"+k);if(p)p.scrollIntoView({behavior:"smooth",block:"start"})}},
  rlsort:a=>{const[k,i]=a.split("|");const st=rlState(k);if(st.sort===+i){if(st.dir>0)st.dir=-1;else{st.sort=null;st.dir=1}}else{st.sort=+i;st.dir=1}st.pg=1;render()},
  rlpg:a=>{const[k,p]=a.split("|");rlState(k).pg=+p;render();const t=root.querySelector(".rl-box");if(t&&t.getBoundingClientRect().top<0)t.scrollIntoView({block:"start"})},
  rltab:a=>{const[k,t]=a.split("|");const st=rlState(k);if(t==="f"&&st.tab==="f")st.fopen=!st.fopen;else{st.tab=t;if(t==="f")st.fopen=true}render()},
  rlf:a=>{const[k,f,v]=a.split("|");const st=rlState(k);st.f[f]=v;st.pg=1;render()},
  rlfclear:k=>{const st=rlState(k);st.f={};st.q="";st.pg=1;render()},
  rlqclear:k=>{const st=rlState(k);st.q="";st.pg=1;render()},
  rlclose:k=>{const st=rlState(k);st.sel=null;st.tab="f";render()},
  madd:k=>openModal(k,"add",null),
  medit:a=>{const[k,id]=a.split("|");openModal(k,"edit",id)},
  mdel:a=>{const[k,id]=a.split("|");askDelete(k,id)},
  mclose:()=>{S.modal=null;render()},
  msave:()=>saveModal(),
  cclose:()=>{S.confirm=null;render()},
  cdo:()=>doDelete(),
  drawer:a=>{S.drawer=a==="1";render()},
  rgo:a=>{S.rfilter=a;go("review")},
  court:a=>{S.openCourt=a;go("org")},
  login:()=>login(S.pick),
  logout:()=>{S.pick=S.user.id;S.user=null;S.drawer=false;S.modal=null;S.confirm=null;render();window.scrollTo({top:0})},
  switch:a=>login(a),
  reset:()=>{init();render();toast("รีเซ็ตเดโมแล้ว")},
  nav:a=>{saveReason();S.drawer=false;if(a==="nation"&&S.page==="nation"){S.nreg=null;S.nsel="root";S.nlist=null;S.nperson=null}go(a)},
  step:a=>{saveReason();S.step=+a;render();window.scrollTo({top:0})},
  add:a=>{const j=CUR();if(j.prefs.length<3)j.prefs.push(a);render()},
  rm:a=>{CUR().prefs.splice(+a,1);render()},
  up:a=>{const p=CUR().prefs,i=+a;[p[i-1],p[i]]=[p[i],p[i-1]];render()},
  adddoc:()=>{saveReason();const j=CUR();j.req.docs.push({name:`เอกสารประกอบ_${j.req.docs.length+1}.pdf`,status:"pending"});render()},
  rmdoc:a=>{saveReason();CUR().req.docs.splice(+a,1);render()},
  savedraft:()=>{saveReason();const j=CUR();if(j.req.status!=="submitted")j.req.status="draft";hist(j,"บันทึกร่างคำขอ");toast("บันทึกร่างแล้ว")},
  submit:()=>{saveReason();const j=CUR();const again=j.req.status==="submitted";j.req.status="submitted";j.req.at=DEMO_DATE;
    if(j.req.reason)j.req.special=j.req.reason;
    hist(j,`${again?"แก้ไขและส่ง":"ส่ง"}คำขอ ${j.prefs.length} อันดับ`);
    log(`${again?"แก้ไขและส่ง":"ส่ง"}คำขอย้าย ${j.prefs.length} อันดับ: ${j.prefs.map(c=>C[c].name).join(", ")}`);S.step=0;go("home");toast("ส่งคำขอแล้ว แก้ไขได้จนถึง 15 ม.ค. 2570")},
  remind:a=>{S.reminded[a]=true;hist(J[a],"เจ้าหน้าที่ส่งแจ้งเตือนให้ยื่นคำขอ");log(`ส่งแจ้งเตือนให้ ${J[a].name} ยื่นคำขอ`);render();toast("ส่งแจ้งเตือนแล้ว")},
  remindall:()=>{const l=JUDGES.filter(j=>inRegion(j,5)&&mustMove(j)&&j.req.status!=="submitted"&&!S.reminded[j.id]);l.forEach(j=>{S.reminded[j.id]=true;hist(j,"เจ้าหน้าที่ส่งแจ้งเตือนให้ยื่นคำขอ")});log(`ส่งแจ้งเตือนผู้ครบวาระที่ยังไม่ยื่น ${l.length} ราย`);render();toast(`ส่งแจ้งเตือน ${l.length} รายแล้ว`)},
  openreview:a=>{S.sel=a;go("review")},
  rfilter:a=>{S.rfilter=a;render()},
  selr:a=>{S.sel=a;render();revealAside()},
  docok:a=>{const[id,i]=a.split(":");const d=J[id].req.docs[+i];d.status="ok";d.note="";hist(J[id],`ยืนยันเอกสาร ${d.name}`);log(`ยืนยันเอกสาร "${d.name}" ของ ${J[id].name}`);render();toast("ยืนยันเอกสารแล้ว")},
  docmore:a=>{const[id,i]=a.split(":");const d=J[id].req.docs[+i];d.status="more";d.note="ขอเอกสารฉบับรับรองสำเนา";hist(J[id],`ขอเอกสารเพิ่ม: ${d.note}`);log(`ขอเอกสารเพิ่มจาก ${J[id].name}`);render();toast("แจ้งขอเอกสารเพิ่มแล้ว")},
  closeround:()=>{const d=JUDGES.filter(j=>j.req.status==="draft").length;S.phase=1;log(`ปิดรับคำขอ (ร่างที่ไม่ได้ส่ง ${d} ราย ถือว่าไม่ได้ยื่น)`);render();toast("ปิดรับคำขอแล้ว")},
  startmatch:()=>{S.phase=2;rerun();log(`เริ่มจัดวาง ได้ร่างผล ตรวจความยุติธรรม${S.result.envy?"ไม่ผ่าน":"ผ่าน"}`);S.filter="all";go("run");toast("จัดวางเสร็จแล้ว")},
  rerun:()=>{rerun();log("คำนวณร่างผลใหม่");render();toast("คำนวณใหม่แล้ว")},
  filter:a=>{S.filter=a;render()},
  sel:a=>{S.sel=a;render();revealAside()},
  lock:a=>{const v=document.getElementById("lockto").value;S.locks[a]=v;rerun();hist(J[a],`เจ้าหน้าที่ล็อกผลที่ ${C[v].name}`);log(`ล็อก ${J[a].name} ที่ ${C[v].name}`);render();toast("ล็อกแล้ว ระบบจัดคนอื่นใหม่")},
  unlock:a=>{delete S.locks[a];rerun();log(`ปลดล็อก ${J[a].name}`);render();toast("ปลดล็อกแล้ว")},
  confirm:a=>{const t=S.result.res[a].to;S.locks[a]=t;rerun();log(`ยืนยันข้อเสนออัตโนมัติ ${J[a].name} ที่ ${C[t].name}`);render();toast("ยืนยันแล้ว")},
  sendkt:()=>{const n=JUDGES.filter(j=>S.result.res[j.id].kind==="none").length;if(n){toast(`ยังมี ${n} รายไม่มีที่ลง`);return}
    const pend=JUDGES.filter(j=>S.result.res[j.id].kind==="auto").length;S.phase=3;S.ktNote="";log(`เสนอร่างบัญชีต่อ ก.ต.${pend?` (มีข้อเสนออัตโนมัติที่ยังไม่ยืนยัน ${pend} ราย)`:""}`);go("chome");toast("เสนอ ก.ต. แล้ว")},
  approve:()=>{S.phase=4;S.ktDecision=stamp();log("ก.ต. อนุมัติร่างบัญชี");log("ประกาศผลการโยกย้ายให้ผู้พิพากษาทุกคน","ระบบ");render();toast("อนุมัติและประกาศผลแล้ว")},
  sendback:()=>{const t=document.getElementById("ktnote");const note=(t&&t.value.trim())||"ขอให้ทบทวนกรณีที่มีเหตุผลพิเศษ";S.ktNote=note;S.phase=2;log(`ก.ต. ส่งร่างกลับให้แก้ไข: ${note}`);render();toast("ส่งกลับแล้ว")},
  resetrules:()=>{RULES=DEFAULT_RULES();if(S.phase===2)rerun();log("คืนค่ากฎเริ่มต้น");render();toast("คืนค่าเริ่มต้นแล้ว")},
};
root.addEventListener("click",e=>{if(e.target.classList.contains("modal-bg")){if(S.confirm)S.confirm=null;else S.modal=null;render();return}const el=e.target.closest("[data-act]");if(!el||el.disabled)return;if(el.tagName==="A")e.preventDefault();const f=ACT[el.dataset.act];if(f)f(el.dataset.arg)});
root.addEventListener("dblclick",e=>{const el=e.target.closest(".acct");if(el)login(el.dataset.arg)});
root.addEventListener("change",e=>{
  const t=e.target;if(!S.user)return;
  if(t.dataset.mf&&S.modal){S.modal.d[t.dataset.mf]=t.type==="checkbox"?t.checked:t.value;delete S.modal.err[t.dataset.mf];if(t.tagName==="SELECT"){if(t.dataset.mf==="jid"){const j=J[t.value];Object.assign(S.modal.d,{p1:"",p2:"",p3:"",reason:j?(j.req.special||j.req.reason||""):"",fallback:j?!!j.req.fallback:false})}render()}return}
  if(t.dataset.rlsize){const st=rlState(t.dataset.rlsize);st.size=+t.value;st.pg=1;render();return}
  if(S.page==="wish"){const j=CUR();
    if(t.id==="sjob"){j.spouse=t.value==="ไม่มีคู่สมรส"?null:{...(j.spouse||{prov:"ลำปาง"}),job:t.value}}
    else if(t.id==="sprov"&&j.spouse)j.spouse.prov=t.value;
    else if(t.id==="mprov")j.mother=t.value==="ไม่มี"?null:t.value;
    else if(t.id==="kprov")j.kids=t.value==="ไม่มี"?null:t.value;
    else if(t.id==="health")j.health=t.checked;
    else if(t.id==="near")j.cond.near=t.checked;
    else if(t.id==="care")j.cond.careNear=t.checked;
    else if(t.id==="sep")j.cond.sep=t.value;
    else if(t.id==="km")j.cond.km=+t.value;
    else if(t.id==="fallback"){j.req.fallback=t.checked;return}
    else if(t.id==="couple"){j.req.couple=t.checked;return}
    else return;
    saveReason();render();return}
  if(S.page==="rules"){
    const map={t02:()=>RULES.T02.on=t.checked,t03:()=>RULES.T03.on=t.checked,r01:()=>RULES.R01.on=t.checked,c02:()=>RULES.C02.on=t.checked,c03:()=>RULES.C03.on=t.checked,
      cap:()=>RULES.T02.cap=Math.max(12,+t.value||72),ry:()=>RULES.R01.years=Math.max(1,+t.value||4),c01:()=>RULES.C01.mode=t.value};
    if(map[t.id]){map[t.id]();if(S.phase===2)rerun();log(`แก้กฎ ${t.id.toUpperCase()}`);render();toast(S.phase===2?"บันทึกกฎแล้ว ร่างผลคำนวณใหม่":"บันทึกกฎแล้ว")}
  }
});
root.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.mf&&S.modal&&t.type!=="checkbox"&&t.tagName!=="SELECT"){S.modal.d[t.dataset.mf]=t.value;return}
  if(t.dataset.rlq){const k=t.dataset.rlq,st=rlState(k);st.q=t.value;st.pg=1;render();const q=document.getElementById("q-"+k);q.focus();q.setSelectionRange(q.value.length,q.value.length);return}
  if(e.target.id==="km"){const v=document.getElementById("kmv");if(v)v.textContent=e.target.value+" กม."}});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(S.confirm){S.confirm=null;render()}else if(S.modal){S.modal=null;render()}else if(S.drawer){S.drawer=false;render()}});
render();
</script>
